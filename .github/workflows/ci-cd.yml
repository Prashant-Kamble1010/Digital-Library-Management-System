
name: Digital Library CI-CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ci-cd-pipeline:
    name: GitHub -> Build -> Test -> Quality -> Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # Stage 1: Build
      - name: Build Production Application
        run: npm run build

      # Stage 2: Automated Testing
      - name: Run Automated Tests
        run: npm run test:run

      - name: Generate Test Coverage
        run: npm run test:coverage

      # Stage 3: Code Quality
      - name: Run ESLint
        run: npm run lint

      - name: Security Audit
        run: npm audit --audit-level=high

      # Prepare build artifact for deployment
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-library-build
          path: frontend/dist/
          if-no-files-found: error

      # Stage 4: Deployment
      - name: Deploy to GitHub Pages
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true

      # Stage 5: Reporting
      - name: Generate Pipeline Summary
        if: always()
        working-directory: .
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports

          {
            echo "# Digital Library CI/CD Pipeline Report"
            echo ""
            echo "## Execution Details"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $BRANCH_NAME"
            echo "- Commit: $COMMIT_SHA"
            echo "- Event: $EVENT_NAME"
            echo "- Triggered by: $ACTOR"
            echo "- Job status: $JOB_STATUS"
            echo "- Date (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo "## Pipeline Workflow"
            echo "GitHub -> Build -> Automated Testing -> Code Quality -> Deployment"
            echo ""
            echo "Check the Actions step results above for the actual status of each stage."
          } > reports/ci-cd-report.md

          cat reports/ci-cd-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-library-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Upload CI/CD Summary Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-library-ci-report
          path: reports/ci-cd-report.md
          if-no-files-found: ignore
